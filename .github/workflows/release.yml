name: Release

# Push a tag like v0.1.0 to build the installer and publish a GitHub Release with checksums and build provenance.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and test
        shell: pwsh
        run: |
          python scripts/validate.py
          if ($LASTEXITCODE -ne 0) { throw "validate.py failed" }
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }
      - name: Compile the launcher and build the installer
        shell: pwsh
        run: |
          ./scripts/build_launcher.ps1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not installed on this runner image; install a pinned version here before releasing." }
          & $iscc /Q installer\Local3D.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Check the tag matches the version in the installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $setup = Get-ChildItem dist\Local3D-Setup-*.exe | Select-Object -First 1
          if ($setup.Name -ne "Local3D-Setup-$tag.exe") { throw "tag v$tag does not match $($setup.Name)" }
      - name: Checksums and release notes
        shell: pwsh
        run: |
          # LF line endings and no BOM, so `sha256sum -c SHA256SUMS.txt` also works on Linux, WSL and Git Bash
          $lines = Get-ChildItem dist\Local3D-Setup-*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) "dist\SHA256SUMS.txt"), (($lines -join "`n") + "`n"), (New-Object Text.UTF8Encoding($false)))
          python scripts/release_notes.py "${{ github.ref_name }}".TrimStart("v") --out release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "release notes failed" }
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/Local3D-Setup-*.exe
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Local3D-Setup-*.exe dist/SHA256SUMS.txt `
            --title "Local3D ${{ github.ref_name }}" --notes-file release-notes.md --verify-tag
