name: Release

# Push a tag like v0.1.0 to build the installer and publish a GitHub Release with checksums and build provenance.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and test
        shell: pwsh
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests
      - name: Compile the launcher and build the installer
        shell: pwsh
        run: |
          ./scripts/build_launcher.ps1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /Q installer\Local3D.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Check the tag matches the version in the installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $setup = Get-ChildItem dist\Local3D-Setup-*.exe | Select-Object -First 1
          if ($setup.Name -ne "Local3D-Setup-$tag.exe") { throw "tag v$tag does not match $($setup.Name)" }
      - name: Checksums and release notes
        shell: pwsh
        run: |
          Push-Location dist
          Get-ChildItem Local3D-Setup-*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
          python scripts/release_notes.py "${{ github.ref_name }}".TrimStart("v") | Set-Content release-notes.md -Encoding utf8
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/Local3D-Setup-*.exe
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Local3D-Setup-*.exe dist/SHA256SUMS.txt `
            --title "Local3D ${{ github.ref_name }}" --notes-file release-notes.md --verify-tag
